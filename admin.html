<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title><link rel="stylesheet" href="assets/style.css"></head>
<body><main>
<h1>Admin</h1>
<div class="switch"><button id="sw" role="switch" aria-checked="false" aria-label="Status" disabled></button><span id="label">…</span></div>
<p id="msg"></p>
<h2>GitHub token</h2>
<p class="sub">A fine-grained token limited to this repository with Contents: read and write. It is stored only in this browser.</p>
<div class="row"><input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
<button class="btn" id="save">Save token</button><button class="btn alt" id="forget">Forget</button></div>
</main>
<script src="assets/common.js"></script>
<script>
nav('admin.html');
const $=id=>document.getElementById(id),sw=$('sw'),msg=$('msg');
const tk=()=>localStorage.getItem('gh_token')||'';
const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function show(on){sw.setAttribute('aria-checked',on);$('label').textContent=on?CFG.yes:CFG.no}
function ready(){sw.disabled=!tk()||!CFG.owner;if(!CFG.owner)msg.textContent='Open this page from your github.io address so the repository can be detected.';else if(!tk())msg.textContent='Add your token to enable the switch.'}
$('save').onclick=()=>{localStorage.setItem('gh_token',$('tok').value.trim());$('tok').value='';msg.textContent='Token saved.';ready()};
$('forget').onclick=()=>{localStorage.removeItem('gh_token');msg.textContent='Token removed.';ready()};
async function init(){try{show(current(await loadHistory()).status)}catch(e){msg.textContent='Could not load status.'}ready()}
sw.onclick=async()=>{
  sw.disabled=true;msg.textContent='Saving…';
  try{
    const h={Authorization:'Bearer '+tk(),Accept:'application/vnd.github+json'};
    const r=await fetch(apiUrl()+'?ref='+CFG.branch,{headers:h,cache:'no-store'});
    if(!r.ok)throw new Error('Read failed ('+r.status+'). Check the token and repository access.');
    const f=await r.json(),hist=JSON.parse(unb64(f.content));
    const next=!current(hist).status;
    hist.push({status:next,at:new Date().toISOString()});
    const p=await fetch(apiUrl(),{method:'PUT',headers:h,body:JSON.stringify({message:'Status: '+(next?CFG.yes:CFG.no),content:b64(JSON.stringify(hist,null,1)+'\n'),sha:f.sha,branch:CFG.branch})});
    if(!p.ok)throw new Error('Write failed ('+p.status+'). The token needs Contents: read and write.');
    show(next);msg.textContent='Saved. Everyone now sees '+(next?CFG.yes:CFG.no)+'.';
  }catch(e){msg.textContent=e.message}
  ready();
};
init();
</script></body></html>
